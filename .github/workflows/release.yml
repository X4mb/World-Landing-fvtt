name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci

      - name: Set version and download URL from tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/ci/set-release-version.mjs

      - name: Validate manifest
        run: npm run validate

      - name: Package module
        run: |
          mkdir -p dist
          zip -r dist/module.zip module.json scripts lang LICENSE README.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/module.zip
            module.json
          generate_release_notes: true
